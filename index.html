function fd(k,o){return pk(k).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'})}
function head(){var i=DAYS.indexOf(tkey());return '<div class="top"><div class="brand">AURUM</div><div class="pill">'+(phase()==='on'?'Day '+(i+1)+' / '+ND:(phase()==='pre'?'Begins 20 Oct':'Complete'))+'</div></div>'}
function ring(pc,a,b){var C=326.7;return '<div class="ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rp" cx="60" cy="60" r="52" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-Math.min(1,pc)))+'"/></svg><div><span class="big">'+a+'</span><small>of '+b+' pts</small></div></div>'}
function today(){
 var ph=phase(),k=view,d=day(k),i=DAYS.indexOf(k),lk=lastK(),h='';
 h+=head()+'<div class="fade"><div class="hi">'+greet()+'.</div><div class="sub">Make today count. Every mark is a promise kept.</div></div>';
 h+='<div class="dn"><button data-a="nav" data-d="-1" aria-label="Previous day"'+(i<=0?' disabled':'')+'>‹</button><b>'+fd(k,{weekday:'long',day:'numeric',month:'long'})+'</b><button data-a="nav" data-d="1" aria-label="Next day"'+(k>=lk?' disabled':'')+'>›</button></div>';
 var p=pts(k),m=poss(k);
 h+='<div class="card"><div class="score">'+ring(p/m,p,m)+'<div class="stats"><div>Habits<b>'+hp(k)+' / 5</b></div><div>Mind<b>'+((d.p?20:0)+(d.g1||0)+(d.g2||0))+' pts</b></div><div>Streak<b>'+streak()+' days</b></div></div></div></div>';
 h+='<div class="card"><div class="lab">Thought for the day</div><div class="q">“'+QUOTES[Math.max(i,0)%QUOTES.length]+'”</div></div>';
 h+='<div class="card"><div class="lab">Daily rituals · 10 pts each</div>';
 HAB.forEach(function(x,n){var v=d.h[n];h+='<div class="h"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><div class="hc"><button class="c y'+(v===1?' on':'')+'" data-a="hab" data-i="'+n+'" data-v="1" aria-pressed="'+(v===1)+'" aria-label="Done: '+x[0]+'">✅</button><button class="c n'+(v===2?' on':'')+'" data-a="hab" data-i="'+n+'" data-v="2" aria-pressed="'+(v===2)+'" aria-label="Missed: '+x[0]+'">❎</button></div></div>'});
 h+='</div>';
 h+='<div class="card"><div class="lab">Mind training</div><div class="row"><b>Daily puzzle</b><span class="tag'+(d.p?' ok':'')+'">'+(PZ[k]<0?'Rest day':(d.p?'Solved +20':'+20 pts'))+'</span></div><div class="row"><b>Memory Grid</b><span class="tag'+(d.g1?' ok':'')+'">'+(d.g1?'+'+d.g1:'up to 10')+'</span></div><div class="row"><b>Number Sprint</b><span class="tag'+(d.g2?' ok':'')+'">'+(d.g2?'+'+d.g2:'up to 10')+'</span></div>'+(k===tkey()?'<div style="margin-top:12px"><button class="btn o" data-a="tab" data-t="mind">Open Mind</button></div>':'')+'</div>';
 h+='<div class="card"><div class="lab">Reflection</div><textarea rows="2" data-n="in" placeholder="Today\'s intention…" aria-label="Intention">'+esc(d.in||'')+'</textarea><textarea rows="2" data-n="gr" style="margin-top:10px" placeholder="One win or gratitude from today…" aria-label="Gratitude">'+esc(d.gr||'')+'</textarea></div>';
 return h}
function pre(){var n=Math.round((pk(DAYS[0])-pk(tkey()))/864e5);
 var h=head()+'<div class="fade"><div class="hi">Your ritual begins soon.</div><div class="sub">A 32-day cycle: 20 October to 20 November.</div></div>';
 h+='<div class="card" style="text-align:center;margin-top:20px"><div class="lab">Starts in</div><div class="big" style="font-size:64px">'+n+'</div><div class="sub">day'+(n===1?'':'s')+' · Tuesday, 20 October</div></div>';
 h+='<div class="card"><div class="lab">Your daily rituals</div>';HAB.forEach(function(x){h+='<div class="h"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div></div>'});
 return h+'</div><div class="card"><div class="q">“'+QUOTES[0]+'”</div></div>'}
function puzInner(k){var d=day(k),i=PZ[k];
 if(i<0)return '<div class="lab">Daily puzzle</div><div class="q">Sunday is a day of rest.</div><div class="sub" style="margin-top:6px">No puzzle today. Let your mind recover.</div>';
 var P=D.P[i];if(d.p)return '<div class="lab">Daily puzzle · '+(i+1)+' of 28</div><div class="row"><b>'+P.t+'</b><span class="tag ok">Solved +20</span></div><div class="sub">Excellent work. Come back tomorrow for a new challenge.</div>';
 return '<div class="lab">Daily puzzle · '+(i+1)+' of 28 · +20 pts</div><b>'+P.t+'</b><div class="pz">'+esc(P.q)+'</div><div class="ans"><input type="text" id="pin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Your answer" aria-label="Answer"><button class="btn" data-a="pz">Submit</button></div><div class="sub" style="margin-top:6px">Format: '+esc(P.f)+'</div><div class="msg" id="pm"></div>'}
function mind(){var ph=phase(),h=head();
 if(ph!=='on')return h+'<div class="card"><div class="lab">Mind training</div><div class="q">'+(ph==='pre'?'Unlocks on 20 October.':'This cycle is complete.')+'</div></div>';
 var k=tkey();
 h+='<div class="fade"><div class="hi">Train your mind.</div><div class="sub">One puzzle and two games a day. Sundays are puzzle-free.</div></div><div style="height:18px"></div>';
 h+='<div class="card" id="puz">'+puzInner(k)+'</div>';
 h+='<div class="card"><div class="lab">Memory Grid · up to 10 pts</div><div class="sub">Watch the pattern, then repeat it. Clear 7 steps for full points.</div><div class="grid9" id="mg">'+[0,1,2,3,4,5,6,7,8].map(function(n){return '<button class="pd" data-a="pad" data-p="'+n+'" aria-label="Pad '+(n+1)+'"></button>'}).join('')+'</div><div class="gm" id="mm">Press start</div><div style="text-align:center;margin-top:10px"><button class="btn" data-a="mgs">Start</button></div></div>';
 h+='<div class="card"><div class="lab">Number Sprint · up to 10 pts</div><div class="sub">Tap 1 to 16 in order, as fast as you can. Under 30 s for full points.</div><div class="g16" id="sg"></div><div class="gm" id="sm">Press start</div><div style="text-align:center;margin-top:10px"><button class="btn" data-a="sps">Start</button></div></div>';
 return h}
function month(){var ph=phase(),t=totals(),h=head(),lk=lastK(),mx=0;DAYS.forEach(function(k){mx+=poss(k)});
 h+='<div class="fade"><div class="hi">'+(ph==='post'?'Final score.':'Your cycle.')+'</div><div class="sub">20 Oct – 20 Nov · 32 days</div></div><div style="height:18px"></div>';
 h+='<div class="card"><div class="score">'+ring(t.pc,t.t,ph==='post'?mx:t.p||mx)+'<div class="stats"><div>'+(ph==='post'?'Final':'So far')+'<b>'+Math.round(t.pc*100)+'%</b></div><div>Rank<b>'+grade(t.pc)+'</b></div><div>Max possible<b>'+mx+'</b></div></div></div></div>';
 h+='<div class="card"><div class="lab">Daily performance</div><div class="bars">'+DAYS.map(function(k){return '<span style="height:'+(k<=lk&&ph!=='pre'?Math.max(3,Math.round(pts(k)/poss(k)*100)):3)+'%;opacity:'+(k<=lk&&ph!=='pre'?.95:.2)+'"></span>'}).join('')+'</div></div>';
 var off=(START.getDay()+6)%7,c='<div class="cal">'+['M','T','W','T','F','S','S'].map(function(x){return '<i>'+x+'</i>'}).join('');for(var i=0;i<off;i++)c+='<span></span>';
 DAYS.forEach(function(k){var f=k>lk||ph==='pre',p=pts(k)/poss(k),dd=pk(k);c+='<button class="cl'+(f?' f':'')+(k===tkey()?' t':'')+(PZ[k]<0?' s':'')+'" data-a="cell" data-k="'+k+'"'+(f?' disabled':'')+' style="'+(f?'':'background:rgba(212,181,122,'+(.06+p*.4)+')')+'"><b>'+dd.getDate()+'</b><small>'+(f?'':pts(k))+'</small></button>'});
 h+='<div class="card"><div class="lab">Calendar · tap a day to review</div>'+c+'</div></div>';
 h+='<div class="card"><div class="lab">How scoring works</div><div class="sub">5 rituals × 10 pts + daily puzzle 20 pts + two brain games up to 10 pts each. Max 90 per day (70 on Sundays). Your final rank is total points ÷ points available.</div></div>';
 return h}
function render(top){clearL();var a=$('app'),ph=phase();
 if(!view||(ph==='on'&&view>lastK()))view=ph==='pre'?DAYS[0]:lastK();
 a.innerHTML=tab==='today'?(ph==='pre'?pre():today()):(tab==='mind'?mind():month());
 Array.prototype.forEach.call($('nav').children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===tab)});
 if(tab==='mind'&&ph==='on')sprintInit();
 if(top)window.scrollTo(0,0)}
/* games */
var mg={s:[],pos:0,busy:true,run:false};
function mset(t){var e=$('mm');if(e)e.textContent=t}
function lit(p){var b=document.querySelector('#mg [data-p="'+p+'"]');if(!b)return;b.classList.add('on');L(function(){b.classList.remove('on')},320)}
function award(g,v){var d=day(tkey());if(v>(d[g]||0)){d[g]=v;save()}}
function mgNext(){mg.s.push(Math.floor(Math.random()*9));mg.pos=0;mg.busy=true;mset('Watch carefully…');mg.s.forEach(function(p,j){L(function(){lit(p)},600+j*650)});L(function(){mg.busy=false;mset('Your turn · '+mg.s.length+' steps')},600+mg.s.length*650)}
function mgEnd(c){mg.run=false;mg.busy=true;var p=c>=7?10:(c>=5?7:(c>=3?4:0));award('g1',p);mset(c>=7?'Flawless! +'+p+' pts':'Cleared '+c+' steps · +'+p+' pts (best of day counts)')}
function sprintInit(){var g=$('sg');if(g)g.innerHTML=''}
var sp={n:1,t0:0,iv:0,run:false};
function sprintStart(){var g=$('sg'),a=[];for(var i=1;i<=16;i++)a.push(i);for(var j=15;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t}
 g.innerHTML=a.map(function(n){return '<button data-a="sn" data-n="'+n+'">'+n+'</button>'}).join('');sp.n=1;sp.t0=Date.now();sp.run=true;clearInterval(sp.iv);
 sp.iv=setInterval(function(){var e=$('sm');if(!e||!sp.run){clearInterval(sp.iv);return}e.textContent='Find '+sp.n+' · '+((Date.now()-sp.t0)/1000).toFixed(1)+'s'},100)}
function sprintTap(b){if(!sp.run)return;var n=+b.getAttribute('data-n');
 if(n===sp.n){b.classList.add('d');sp.n++;if(sp.n>16){sp.run=false;clearInterval(sp.iv);var s=(Date.now()-sp.t0)/1000,p=s<=30?10:(s<=45?7:4);award('g2',p);$('sm').textContent='Done in '+s.toFixed(1)+'s · +'+p+' pts'}}
 else{b.classList.add('b');setTimeout(function(){b.classList.remove('b')},250)}}
/* puzzle */
function h53(s){var h1=0xdeadbeef,h2=0x41c6ce57,i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function pzCheck(){var k=tkey(),i=PZ[k],inp=$('pin'),m=$('pm'),v=String(inp.value).toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!v){m.className='msg no';m.textContent='Enter your answer first.';return}
 if(h53(v)===D.H[i]){var d=day(k);d.p=1;save();$('puz').innerHTML=puzInner(k);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
 else{m.className='msg no';m.textContent='Not quite. Think it through and try again.';var c=$('puz');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}
/* events */
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
 if(a==='tab'){tab=b.getAttribute('data-t');render(true)}
 else if(a==='nav'){var i=DAYS.indexOf(view)+(+b.getAttribute('data-d'));if(i>=0&&DAYS[i]<=lastK()){view=DAYS[i];render()}}
 else if(a==='cell'){view=b.getAttribute('data-k');tab='today';render(true)}
 else if(a==='hab'&&phase()==='on'){var d=day(view),i=+b.getAttribute('data-i'),v=+b.getAttribute('data-v');d.h[i]=d.h[i]===v?0:v;save();try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}render()}
 else if(a==='pz')pzCheck();
 else if(a==='mgs'){clearL();Array.prototype.forEach.call(document.querySelectorAll('#mg .pd'),function(x){x.classList.remove('on')});mg.s=[Math.floor(Math.random()*9),Math.floor(Math.random()*9)];mg.run=true;mgNext()}
 else if(a==='pad'){if(!mg.run||mg.busy)return;var p=+b.getAttribute('data-p');lit(p);
  if(p===mg.s[mg.pos]){mg.pos++;if(mg.pos===mg.s.length){var c=mg.s.length;mg.busy=true;if(c>=7)mgEnd(c);else{mset('Correct!');L(mgNext,700)}}}else mgEnd(mg.s.length-1)}
 else if(a==='sps')sprintStart();
 else if(a==='sn')sprintTap(b)});
document.addEventListener('input',function(e){var n=e.target.getAttribute&&e.target.getAttribute('data-n');if(n==='in'||n==='gr'){day(view)[n]=e.target.value.slice(0,400);save()}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pin'){e.preventDefault();pzCheck()}});
window.addEventListener('hashchange',function(){view='';render(true)});
load();render();
</script>
</body>
</html>
